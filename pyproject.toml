[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "memecoin-agent"
version = "0.0.1"
description = "Local signal agent for new pump.fun tokens. Analysis and alerts only; it never trades."
requires-python = ">=3.11"
dependencies = [
    "websockets>=15",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "PyYAML>=6",
    "typer>=0.12",
    "pyarrow>=17",
    "duckdb>=1.1",
    "httpx>=0.27",
    "cbor2>=5.6",
    "zstandard>=0.22",
    "textual>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agentd = "agent.cli.agentd:app"
agent = "agent.cli.agent:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent = ["ingest/idl/*.json", "ingest/idl/SOURCE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
